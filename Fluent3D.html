<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluent 3D Glass Panels</title>
<style>
:root {
  /* ── 玻璃板 ── */
  --glass-tint: 0.18;
  --glass-edge: 1;
  --glass-blur: 8px;
  --glass-saturate: 1.8;
  --glass-brightness: 1.05;

  /* ── 厚度面 ── */
  --thickness-color: 220, 228, 245;
  --thickness-shade: 1;
  --thickness-h: 8px;
  --thickness-narrow: 8px;
  --board-gap: 2px;

  /* ── 磨砂玻璃背景 ── */
  --bg-frost-tint: 0.30;
  --bg-frost-blur: 52px;
  --bg-frost-saturate: 1.35;

  /* ── 图片层 ── */
  --bg-img-opacity: 1;
  --bg-img-blur: 0px;
  --fg-img-opacity: 1;
  --fg-img-blur: 0px;

  /* ── 光源 ── */
  --beam-color: 255, 245, 220;
  --beam-strength: 0.22;
  --beam-angle: 218deg;
  --beam-x: 0vw;
  --glow-color: 255, 245, 215;
  --glow-strength: 0.78;

  /* ── 品牌色 ── */
  --s1-brand: 43, 87, 154;      /* ★ 第一块品牌条主色 */
  --brand-color: 43, 87, 154;   /* 第二块指示条色 */
  --brand-glow: 1;

  /* ── 图标按钮 ── */
  --btn-height: 6px;
  --btn-size: 34px;
  --btn-glow: 1;

  --board-w: 720px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  background:
    radial-gradient(55% 45% at 78% 8%, #ffd9a8 0%, transparent 55%),
    radial-gradient(50% 50% at 15% 88%, #8f9cc8 0%, transparent 60%),
    linear-gradient(135deg, #d4d9e8 0%, #bcc4d9 50%, #a8b0c8 100%);
}

.scene {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bg-image-back {
  position: absolute;
  inset: 3% 5%;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  pointer-events: none;
  opacity: var(--bg-img-opacity);
  filter: blur(var(--bg-img-blur));
  transition: opacity 0.3s ease, filter 0.3s ease;
  z-index: -1;
}

.bg-frosted {
  position: absolute;
  inset: 3% 5%;
  border-radius: 8px;
  background: rgba(255, 255, 255, var(--bg-frost-tint));
  backdrop-filter: blur(var(--bg-frost-blur)) saturate(var(--bg-frost-saturate)) brightness(1.06);
  -webkit-backdrop-filter: blur(var(--bg-frost-blur)) saturate(var(--bg-frost-saturate)) brightness(1.06);
  border: 1px solid rgba(255, 255, 255, 0.9);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 1),
    inset 0 -2px 0 rgba(140, 150, 185, 0.55),
    inset 2px 0 0 rgba(255, 255, 255, 0.75),
    inset -2px 0 0 rgba(255, 255, 255, 0.75),
    inset 0 0 140px rgba(255, 255, 255, 0.12),
    8px 10px 0 rgba(180, 188, 215, 0.55),
    16px 20px 0 rgba(158, 166, 198, 0.35),
    24px 30px 0 rgba(136, 144, 182, 0.2),
    50px 70px 110px rgba(55, 65, 105, 0.35);
  overflow: hidden;
  z-index: 0;
}
.bg-frosted::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 240px 240px;
  opacity: 0.15;
  mix-blend-mode: overlay;
  pointer-events: none;
}
.bg-frosted::after {
  content: '';
  position: absolute;
  top: -30%;
  right: -20%;
  width: 75%;
  height: 95%;
  background: radial-gradient(ellipse at center,
    rgba(var(--glow-color), var(--glow-strength)) 0%,
    rgba(var(--glow-color), calc(var(--glow-strength) * 0.55)) 28%,
    rgba(var(--glow-color), calc(var(--glow-strength) * 0.2)) 55%,
    transparent 78%);
  filter: blur(24px);
  pointer-events: none;
}

.bg-image-front {
  position: absolute;
  inset: 3% 5%;
  border-radius: 8px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  pointer-events: none;
  opacity: var(--fg-img-opacity);
  filter: blur(var(--fg-img-blur));
  transition: opacity 0.3s ease, filter 0.3s ease;
  z-index: 1;
}

.light-beam {
  position: absolute;
  inset: -60% -40%;
  pointer-events: none;
  background:
    linear-gradient(var(--beam-angle),
      transparent 0%,
      transparent 20%,
      rgba(var(--beam-color), calc(var(--beam-strength) * 0.7)) 27%,
      rgba(var(--beam-color), var(--beam-strength)) 31%,
      rgba(var(--beam-color), calc(var(--beam-strength) * 0.55)) 37%,
      transparent 45%,
      transparent 100%);
  filter: blur(14px);
  transform: translateX(var(--beam-x));
  transition: background 0.3s ease, transform 0.25s ease;
  z-index: 2;
}

.stack {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--board-gap);
  transition: gap 0.2s ease;
}
.board {
  position: relative;
  width: var(--board-w);
}

.board-main {
  position: relative;
  width: 100%;
  overflow: hidden;
  background:
    linear-gradient(155deg,
      rgba(255, 255, 255, calc(var(--glass-tint) * 1.2)) 0%,
      rgba(255, 255, 255, calc(var(--glass-tint) * 0.5)) 42%,
      rgba(255, 255, 255, calc(var(--glass-tint) * 0.85)) 100%);
  backdrop-filter:
    blur(var(--glass-blur))
    saturate(var(--glass-saturate))
    brightness(var(--glass-brightness));
  -webkit-backdrop-filter:
    blur(var(--glass-blur))
    saturate(var(--glass-saturate))
    brightness(var(--glass-brightness));
  border: 1px solid rgba(255, 255, 255, calc(var(--glass-edge) * 0.95));
  border-bottom: none;
  box-shadow:
    inset 0 1.5px 1.5px rgba(255, 255, 255, var(--glass-edge)),
    inset 1.5px 0 1.5px rgba(255, 255, 255, calc(var(--glass-edge) * 0.9)),
    inset -1.5px 0 1.5px rgba(255, 255, 255, calc(var(--glass-edge) * 0.9)),
    inset 0 0 70px rgba(255, 255, 255, calc(var(--glass-edge) * 0.14));
  transition: background 0.2s ease, backdrop-filter 0.2s ease, box-shadow 0.2s ease;
}
.board-main::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(118deg,
      rgba(255, 255, 255, calc(var(--glass-edge) * 0.28)) 0%,
      transparent 22%,
      transparent 68%,
      rgba(255, 255, 255, calc(var(--glass-edge) * 0.12)) 100%),
    radial-gradient(circle at 82% 6%,
      rgba(var(--glow-color), calc(var(--glass-edge) * 0.32)), transparent 34%);
  pointer-events: none;
  z-index: 5;
}

.board-thickness {
  width: 100%;
  height: var(--thickness-h);
  clip-path: polygon(0 0, 100% 0,
    calc(100% - var(--thickness-narrow)) 100%,
    var(--thickness-narrow) 100%);
  background:
    linear-gradient(to right, rgba(255, 255, 255, 0.55) 0, transparent 1.5px),
    linear-gradient(to left,  rgba(255, 255, 255, 0.7)  0, transparent 1.5px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.75) 0, transparent 2px),
    linear-gradient(115deg,
      rgba(var(--thickness-color), calc(0.75 * var(--thickness-shade))) 0%,
      rgba(var(--thickness-color), calc(0.85 * var(--thickness-shade))) 30%,
      rgba(var(--thickness-color), calc(0.95 * var(--thickness-shade))) 70%,
      rgba(255, 255, 255,          calc(0.98 * var(--thickness-shade))) 100%);
  transition: height 0.2s ease, background 0.2s ease;
}

/* ============================================================
   ★ 第一块 · 品牌条
   颜色来自 --s1-brand，用 color-mix 自动生成上亮下暗的渐变
   ============================================================ */
.strip {
  height: 100%;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: #fff;
  position: relative;
  background: linear-gradient(180deg,
    color-mix(in srgb, rgb(var(--s1-brand)) 75%, white) 0%,
    rgb(var(--s1-brand)) 100%);
  transition: background 0.25s ease;
}
/* 不支持 color-mix 的浏览器降级 */
@supports not (background: color-mix(in srgb, red 50%, blue)) {
  .strip {
    background: linear-gradient(180deg,
      rgba(var(--s1-brand), 1) 0%,
      rgba(var(--s1-brand), 0.85) 100%);
  }
}

.strip::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(255, 255, 255, 0.28) 0%,
    rgba(255, 255, 255, 0) 55%,
    rgba(0, 0, 0, 0.15) 100%);
  pointer-events: none;
}
.dots {
  display: grid;
  grid-template-columns: repeat(3, 4px);
  gap: 4px;
  flex-shrink: 0;
}
.dots i {
  width: 4px; height: 4px;
  background: rgba(255, 255, 255, 0.92);
  border-radius: 50%;
  box-shadow: 0 0 2px rgba(255, 255, 255, 0.6);
}
.brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
}
.tagline {
  font-size: 13px;
  font-weight: 500;
  font-style: italic;
  letter-spacing: 0.4px;
  opacity: 0.92;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

.menu-bar {
  height: 100%;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  font-size: 14px;
  font-weight: 600;
  color: #3a3a4a;
  background: rgba(255, 255, 255, 0.68);
  position: relative;
}
.menu-bar span {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: color 0.2s ease, text-shadow 0.2s ease;
  z-index: 1;
}
.menu-bar span:hover { color: #1a2a4a; }
.menu-bar span.active {
  color: rgb(var(--brand-color));
  font-weight: 700;
  text-shadow:
    0 0 calc(6px * var(--brand-glow)) rgba(var(--brand-color), calc(0.6 * var(--brand-glow))),
    0 0 calc(14px * var(--brand-glow)) rgba(var(--brand-color), calc(0.35 * var(--brand-glow)));
}

.menu-indicator {
  position: absolute;
  bottom: 0;
  height: 3px;
  background: rgb(var(--brand-color));
  border-radius: 2px 2px 0 0;
  transition: left 0.32s cubic-bezier(0.34, 1.4, 0.64, 1),
              width 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
  pointer-events: none;
  box-shadow:
    0 0 calc(6px * var(--brand-glow)) rgba(var(--brand-color), calc(0.9 * var(--brand-glow))),
    0 0 calc(14px * var(--brand-glow)) rgba(var(--brand-color), calc(0.6 * var(--brand-glow))),
    0 0 calc(24px * var(--brand-glow)) rgba(var(--brand-color), calc(0.35 * var(--brand-glow)));
  z-index: 0;
}
.menu-indicator::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 140%;
  height: 26px;
  background: radial-gradient(ellipse at bottom center,
    rgba(var(--brand-color), calc(0.5 * var(--brand-glow))) 0%,
    rgba(var(--brand-color), calc(0.15 * var(--brand-glow))) 45%,
    transparent 75%);
  pointer-events: none;
}

.ribbon {
  height: 100%;
  padding: 12px 24px;
  display: flex;
  gap: 20px;
  align-items: center;
  background: rgba(255, 255, 255, 0.26);
}
.ribbon-group {
  display: flex;
  gap: 12px;
  padding-right: 20px;
  border-right: 1px solid rgba(180, 180, 200, 0.42);
  height: 100%;
  align-items: center;
}
.ribbon-group:last-child { border-right: none; }

.tool {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  width: 50px;
  padding-bottom: calc(var(--btn-height) + 4px);
  color: #3a3a52;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  cursor: pointer;
  position: relative;
  transition: color 0.18s ease;
  text-shadow:
    0 0 calc(2px * var(--btn-glow)) rgba(90, 130, 200, calc(0.4 * var(--btn-glow))),
    0 0 calc(5px * var(--btn-glow)) rgba(90, 130, 200, calc(0.25 * var(--btn-glow)));
}
.tool:hover {
  color: #2b579a;
  text-shadow:
    0 0 calc(3px * var(--btn-glow)) rgba(90, 130, 200, calc(0.7 * var(--btn-glow))),
    0 0 calc(8px * var(--btn-glow)) rgba(90, 130, 200, calc(0.4 * var(--btn-glow))),
    0 0 calc(14px * var(--btn-glow)) rgba(90, 130, 200, calc(0.2 * var(--btn-glow)));
}

.tool-ico {
  width: var(--btn-size);
  height: var(--btn-size);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  position: relative;
  background: linear-gradient(155deg, #ffffff 0%, #f0f3fc 100%);
  border: 1px solid rgba(255, 255, 255, 1);
  border-radius: 3px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 1),
    inset 1px 0 0 rgba(255, 255, 255, 0.85),
    inset -1px 0 0 rgba(255, 255, 255, 0.85),
    inset -3px -3px 6px rgba(255, 250, 230, 0.5);
  transition:
    transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1),
    background 0.18s ease,
    box-shadow 0.18s ease;
  z-index: 2;
}
.tool-ico::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(125deg,
    rgba(255, 255, 255, 0.55) 0%,
    transparent 35%,
    transparent 70%,
    rgba(255, 255, 255, 0.3) 100%);
  pointer-events: none;
}
.tool-ico > * { position: relative; z-index: 1; }

.tool-ico::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  height: var(--btn-height);
  background: linear-gradient(180deg,
    rgba(210, 218, 240, 0.98) 0%,
    rgba(180, 190, 220, 0.9)  45%,
    rgba(155, 165, 200, 0.75) 100%);
  clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 100%, 3px 100%);
  border-radius: 0 0 3px 3px;
  transition: height 0.22s cubic-bezier(0.34, 1.4, 0.64, 1),
              opacity 0.22s ease;
  z-index: 1;
  pointer-events: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.tool:hover .tool-ico {
  background: linear-gradient(155deg, #ffffff 0%, #e6ecff 100%);
  transform: translateY(-1px);
}
.tool:hover .tool-ico::after {
  height: calc(var(--btn-height) + 2px);
}

.tool.pressed {
  color: #2b579a;
  text-shadow:
    0 0 calc(4px * var(--btn-glow)) rgba(90, 130, 200, calc(0.7 * var(--btn-glow))),
    0 0 calc(10px * var(--btn-glow)) rgba(90, 130, 200, calc(0.4 * var(--btn-glow)));
}
.tool.pressed .tool-ico {
  background: linear-gradient(155deg, #dce4f5 0%, #cdd7ee 100%);
  transform: translateY(calc(var(--btn-height) * 0.7));
  box-shadow:
    inset 2px 2px 5px rgba(110, 120, 165, 0.55),
    inset -1px -1px 2px rgba(255, 255, 255, 0.85),
    inset 0 0 0 1px rgba(255, 255, 255, 0.5);
}
.tool.pressed .tool-ico::before {
  background: linear-gradient(125deg,
    rgba(255, 255, 255, 0.25) 0%,
    transparent 55%,
    transparent 85%,
    rgba(255, 255, 255, 0.15) 100%);
}
.tool.pressed .tool-ico::after {
  height: calc(var(--btn-height) * 0.3);
  opacity: 0.5;
}

/* ============================================================
   控制面板
   ============================================================ */
.control-panel {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 320px;
  max-height: calc(100vh - 32px);
  display: flex;
  flex-direction: column;
  background: rgba(24, 18, 44, 0.82);
  backdrop-filter: blur(28px) saturate(1.4);
  -webkit-backdrop-filter: blur(28px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(10, 5, 30, 0.5);
  z-index: 100;
  color: #fff;
  font-size: 11px;
  transition: transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1),
              opacity 0.28s ease;
}
.control-panel.collapsed {
  transform: translateX(calc(100% + 24px));
  opacity: 0;
  pointer-events: none;
}

.panel-header {
  flex-shrink: 0;
  padding: 12px 16px 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-header-text { display: flex; flex-direction: column; gap: 2px; }
.panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
.panel-sub { font-size: 9.5px; opacity: 0.45; letter-spacing: 0.3px; }
.panel-close {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.panel-close:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

.panel-body {
  overflow-y: auto;
  padding: 8px 12px 14px;
  flex: 1;
}
.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 3px;
}
.panel-body::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.3);
}

.section {
  margin-bottom: 8px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  overflow: hidden;
  transition: background 0.2s ease;
}
.section.expanded { background: rgba(255, 255, 255, 0.04); }

.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.section-header:hover { background: rgba(255, 255, 255, 0.05); }

.section-icon {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px;
  font-size: 11px;
  flex-shrink: 0;
  transition: transform 0.3s ease;
}
.section-icon.bg    { background: rgba(120, 160, 240, 0.2); color: #9eb8f0; }
.section-icon.s1    { background: rgba(90, 142, 219, 0.22); color: #7ab2f0; }
.section-icon.s2    { background: rgba(120, 200, 240, 0.2); color: #7ad0f0; }
.section-icon.s3    { background: rgba(180, 150, 240, 0.2); color: #c0a0f0; }
.section-icon.global { background: rgba(255, 200, 140, 0.18); color: #ffc88c; }

.section-title {
  flex: 1;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: rgba(255, 255, 255, 0.9);
}
.section-subtitle {
  font-size: 9px;
  opacity: 0.4;
  letter-spacing: 0.3px;
  margin-left: auto;
  margin-right: 6px;
}
.section-arrow {
  font-size: 9px;
  color: rgba(255, 255, 255, 0.4);
  transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  flex-shrink: 0;
}
.section.expanded .section-arrow {
  transform: rotate(90deg);
  color: rgba(255, 255, 255, 0.85);
}

.section-content {
  max-height: 0;
  overflow: hidden;
  padding: 0 12px;
  transition: max-height 0.35s cubic-bezier(0.34, 1.4, 0.64, 1),
              padding 0.3s ease,
              opacity 0.25s ease;
  opacity: 0;
}
.section.expanded .section-content {
  max-height: 2000px;
  padding: 2px 12px 12px;
  opacity: 1;
}

.sub-title {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  color: #8fa0d0;
  text-transform: uppercase;
  margin: 10px 0 6px;
  padding-bottom: 4px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-title:first-child { margin-top: 2px; }
.sub-title .layer-chip {
  font-size: 8.5px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: none;
}
.layer-chip.back  { background: rgba(120, 140, 200, 0.25); color: #a8b8e8; }

  const stack = document.getElementById('stack');

  function renderBoards() {
    stack.innerHTML = '';

    const b1 = document.createElement('div');
    b1.className = 'board';
    b1.innerHTML = `
      <div class="board-main" style="height:${state.s1H}px">
        <div class="strip">
          <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="brand-name">${state.brandName}</div>
          <div class="tagline">${state.tagline}</div>
        </div>
      </div>
      <div class="board-thickness"></div>`;
    stack.appendChild(b1);

    const b2 = document.createElement('div');
    b2.className = 'board';
    b2.innerHTML = `
      <div class="board-main" style="height:${state.s2H}px">
        <div class="menu-bar">
          <div class="menu-indicator"></div>
          ${state.menuItems.map((item, i) =>
            `<span${i === state.menuActive ? ' class="active"' : ''}>${item}</span>`
          ).join('')}
        </div>
      </div>
      <div class="board-thickness"></div>`;
    stack.appendChild(b2);

    const b3 = document.createElement('div');
    b3.className = 'board';
    b3.innerHTML = `
      <div class="board-main" style="height:${state.s3H}px">
        <div class="ribbon">${toolsHTML}</div>
      </div>
      <div class="board-thickness"></div>`;
    stack.appendChild(b3);

    bindBoardEvents();
  }

  function bindBoardEvents() {
    document.querySelectorAll('.tool').forEach(tool => {
      tool.addEventListener('click', () => tool.classList.toggle('pressed'));
    });

    document.querySelectorAll('.menu-bar').forEach(bar => {
      const indicator = bar.querySelector('.menu-indicator');
      const items = bar.querySelectorAll('span');
      if (!indicator || !items.length) return;

      function positionIndicator(item) {
        indicator.style.left = item.offsetLeft + 'px';
        indicator.style.width = item.offsetWidth + 'px';
      }

      items.forEach(item => {
        item.addEventListener('click', () => {
          items.forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          positionIndicator(item);
        });
      });

      const active = bar.querySelector('span.active');
      if (active) requestAnimationFrame(() => positionIndicator(active));
    });
  }

  renderBoards();

  /* 面板折叠 */
  const panel = document.getElementById('controlPanel');
  const toggleBtn = document.getElementById('toggleBtn');
  const panelClose = document.getElementById('panelClose');

  function setPanelCollapsed(collapsed) {
    panel.classList.toggle('collapsed', collapsed);
    toggleBtn.classList.toggle('visible', collapsed);
  }

  panelClose.addEventListener('click', () => setPanelCollapsed(true));
  toggleBtn.addEventListener('click', () => setPanelCollapsed(false));
  setPanelCollapsed(false);

  /* 分区折叠 */
  document.querySelectorAll('.section').forEach(section => {
    const header = section.querySelector('.section-header');
    header.addEventListener('click', () => {
      section.classList.toggle('expanded');
    });
  });
  document.querySelector('[data-section="bg"]').classList.add('expanded');

  /* 参数绑定 */
  const root = document.documentElement;

  function bindSlider(id, valId, cssVar, map) {
    const el = document.getElementById(id);
    const val = document.getElementById(valId);
    if (!el || !val) return;
    const update = () => {
      const raw = parseFloat(el.value);
      const { value, display } = map(raw);
      root.style.setProperty(cssVar, value);
      val.textContent = display;
    };
    el.addEventListener('input', update);
    update();
  }

  bindSlider('bgTint', 'v-bgTint', '--bg-frost-tint', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('bgBlur', 'v-bgBlur', '--bg-frost-blur', v => ({ value: v + 'px', display: v + 'px' }));

  bindSlider('bgImgOp', 'v-bgImgOp', '--bg-img-opacity', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('bgImgBlur', 'v-bgImgBlur', '--bg-img-blur', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('fgImgOp', 'v-fgImgOp', '--fg-img-opacity', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('fgImgBlur', 'v-fgImgBlur', '--fg-img-blur', v => ({ value: v + 'px', display: v + 'px' }));

  bindSlider('beamS', 'v-beamS', '--beam-strength', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('beamA', 'v-beamA', '--beam-angle', v => ({ value: v + 'deg', display: v + '°' }));
  bindSlider('beamX', 'v-beamX', '--beam-x', v => ({ value: v + 'vw', display: v + 'vw' }));
  bindSlider('glow', 'v-glow', '--glow-strength', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));

  bindSlider('glassTint', 'v-glassTint', '--glass-tint', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('glassEdge', 'v-glassEdge', '--glass-edge', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('glassBlur', 'v-glassBlur', '--glass-blur', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('glassSat', 'v-glassSat', '--glass-saturate', v => ({ value: v / 10, display: (v / 10).toFixed(1) }));
  bindSlider('glassBri', 'v-glassBri', '--glass-brightness', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));

  bindSlider('thickShade', 'v-thickShade', '--thickness-shade', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));
  bindSlider('thickH', 'v-thickH', '--thickness-h', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('thickN', 'v-thickN', '--thickness-narrow', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('gap', 'v-gap', '--board-gap', v => ({ value: v + 'px', display: v + 'px' }));

  bindSlider('brandGlow', 'v-brandGlow', '--brand-glow', v => ({ value: v / 100, display: (v / 100).toFixed(2) }));

  bindSlider('btnH', 'v-btnH', '--btn-height', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('btnSize', 'v-btnSize', '--btn-size', v => ({ value: v + 'px', display: v + 'px' }));
  bindSlider('btnG', 'v-btnG', '--btn-glow', v => ({ value: v / 100, display: (v / 100).toFixed(1) + '×' }));

  /* 第一块：文字 */
  const brandNameInput = document.getElementById('brandNameInput');
  const taglineInput = document.getElementById('taglineInput');

  brandNameInput.addEventListener('input', e => {
    state.brandName = e.target.value;
    const el = stack.querySelector('.brand-name');
    if (el) el.textContent = state.brandName;
  });
  taglineInput.addEventListener('input', e => {
    state.tagline = e.target.value;
    const el = stack.querySelector('.tagline');
    if (el) el.textContent = state.tagline;
  });

  /* 第一块：高度 */
  const s1H = document.getElementById('s1H');
  const s1HVal = document.getElementById('v-s1-h');
  s1H.addEventListener('input', e => {
    state.s1H = parseInt(e.target.value, 10);
    s1HVal.textContent = state.s1H + 'px';
    const main = stack.children[0].querySelector('.board-main');
    if (main) main.style.height = state.s1H + 'px';
  });

  /* 第二块：高度 + 菜单项 */
  const s2H = document.getElementById('s2H');
  const s2HVal = document.getElementById('v-s2-h');
  s2H.addEventListener('input', e => {
    state.s2H = parseInt(e.target.value, 10);
    s2HVal.textContent = state.s2H + 'px';
    const main = stack.children[1].querySelector('.board-main');
    if (main) main.style.height = state.s2H + 'px';
  });

  const menuItemsInput = document.getElementById('menuItemsInput');
  menuItemsInput.addEventListener('change', e => {
    const arr = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
    if (!arr.length) return;
    state.menuItems = arr;
    if (state.menuActive >= arr.length) state.menuActive = 0;
    renderBoards();
  });

  /* 第三块：高度 */
  const s3H = document.getElementById('s3H');
  const s3HVal = document.getElementById('v-s3-h');
  s3H.addEventListener('input', e => {
    state.s3H = parseInt(e.target.value, 10);
    s3HVal.textContent = state.s3H + 'px';
    const main = stack.children[2].querySelector('.board-main');
    if (main) main.style.height = state.s3H + 'px';
  });

  /* 预设 */
  function setSlider(id, val) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = val;
    el.dispatchEvent(new Event('input'));
  }

  document.getElementById('presetTransparent').addEventListener('click', () => {
    setSlider('glassTint', 0);
    setSlider('glassEdge', 0);
    setSlider('glassBlur', 0);
    setSlider('glassSat', 18);
    setSlider('glassBri', 110);
  });

  document.getElementById('presetFrosted').addEventListener('click', () => {
    setSlider('glassTint', 45);
    setSlider('glassEdge', 100);
    setSlider('glassBlur', 20);
    setSlider('glassSat', 15);
    setSlider('glassBri', 105);
  });

  /* 图片层 */
  function bindImageLayer(opts) {
    const el = document.getElementById(opts.elId);
    const urlInput = document.getElementById(opts.urlId);
    const fileInput = document.getElementById(opts.fileId);

    function setImage(url) { el.style.backgroundImage = url ? `url("${url}")` : 'none'; }

    document.getElementById(opts.loadId).addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) setImage(url);
    });
    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const url = urlInput.value.trim();
        if (url) setImage(url);
      }
    });
    document.getElementById(opts.uploadId).addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        setImage(ev.target.result);
        urlInput.value = '(已上传: ' + file.name + ')';
      };
      reader.readAsDataURL(file);
    });
    document.getElementById(opts.clearId).addEventListener('click', () => {
      setImage('');
      urlInput.value = '';
      fileInput.value = '';
    });
  }

  bindImageLayer({ elId: 'bgImageBack',  urlId: 'backUrl',  fileId: 'backFile',  loadId: 'backLoadBtn',  uploadId: 'backUploadBtn',  clearId: 'backClearBtn' });
  bindImageLayer({ elId: 'bgImageFront', urlId: 'frontUrl', fileId: 'frontFile', loadId: 'frontLoadBtn', uploadId: 'frontUploadBtn', clearId: 'frontClearBtn' });

  /* ============================================================
     ★ 颜色参数 —— 新增 s1Color（第一块品牌条）
     ============================================================ */
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return `${parseInt(h.substring(0,2),16)}, ${parseInt(h.substring(2,4),16)}, ${parseInt(h.substring(4,6),16)}`;
  }

  const beamColorInput  = document.getElementById('beamColor');
  const glowColorInput  = document.getElementById('glowColor');
  const thickColorInput = document.getElementById('thickColor');
  const brandColorInput = document.getElementById('brandColor');
  const s1ColorInput    = document.getElementById('s1Color');   /* ★ 新增 */

  function setBeamColor(hex)  { root.style.setProperty('--beam-color', hexToRgb(hex)); beamColorInput.value = hex; }
  function setGlowColor(hex)  { root.style.setProperty('--glow-color', hexToRgb(hex)); glowColorInput.value = hex; }
  function setThickColor(hex) { root.style.setProperty('--thickness-color', hexToRgb(hex)); thickColorInput.value = hex; }
  function setBrandColor(hex) { root.style.setProperty('--brand-color', hexToRgb(hex)); brandColorInput.value = hex; }
  function setS1Color(hex)    { root.style.setProperty('--s1-brand', hexToRgb(hex)); s1ColorInput.value = hex; }  /* ★ 新增 */

  beamColorInput.addEventListener('input', e => setBeamColor(e.target.value));
  glowColorInput.addEventListener('input', e => setGlowColor(e.target.value));
  thickColorInput.addEventListener('input', e => setThickColor(e.target.value));
  brandColorInput.addEventListener('input', e => setBrandColor(e.target.value));
  s1ColorInput.addEventListener('input', e => setS1Color(e.target.value));   /* ★ 新增 */

  document.querySelectorAll('.color-preset').forEach(dot => {
    dot.addEventListener('click', () => {
      const t = dot.dataset.target;
      const c = dot.dataset.color;
      if (t === 'beam') setBeamColor(c);
      else if (t === 'glow') setGlowColor(c);
      else if (t === 'thick') setThickColor(c);
      else if (t === 'brand') setBrandColor(c);
      else if (t === 's1')    setS1Color(c);       /* ★ 新增 */
    });
  });

  setBeamColor(beamColorInput.value);
  setGlowColor(glowColorInput.value);
  setThickColor(thickColorInput.value);
  setBrandColor(brandColorInput.value);
  setS1Color(s1ColorInput.value);                /* ★ 新增 */

  /* 响应式 */
  function fitToViewport() {
    const minSide = Math.min(window.innerWidth, window.innerHeight);
    const s = Math.min(1, minSide / 900);
    stack.style.transform = `scale(${s})`;
    document.querySelectorAll('.menu-bar').forEach(bar => {
      const ind = bar.querySelector('.menu-indicator');
      const act = bar.querySelector('span.active');
      if (ind && act) {
        ind.style.left = act.offsetLeft + 'px';
        ind.style.width = act.offsetWidth + 'px';
      }
    });
  }
  window.addEventListener('resize', fitToViewport);
  fitToViewport();

  /* 配置导出 */
  window.exportConfig = function () {
    const vars = [
      '--glass-tint', '--glass-edge', '--glass-blur', '--glass-saturate', '--glass-brightness',
      '--thickness-color', '--thickness-shade', '--thickness-h', '--thickness-narrow', '--board-gap',
      '--bg-frost-tint', '--bg-frost-blur',
      '--bg-img-opacity', '--bg-img-blur', '--fg-img-opacity', '--fg-img-blur',
      '--beam-color', '--beam-strength', '--beam-angle', '--beam-x',
      '--glow-color', '--glow-strength',
      '--s1-brand', '--brand-color', '--brand-glow',
      '--btn-height', '--btn-size', '--btn-glow'
    ];
    const cfg = {};
    vars.forEach(v => {
      cfg[v] = root.style.getPropertyValue(v).trim() ||
               getComputedStyle(root).getPropertyValue(v).trim();
    });
    console.log('%c📦 配置', 'color:#a5b8ff;font-weight:bold');
    console.log(JSON.stringify(cfg, null, 2));
    return cfg;
  };

})();
</script>
</body>
</html>
